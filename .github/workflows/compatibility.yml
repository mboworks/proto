name: Compatibility

on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protobuf:
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        # Current protobuf major and the two preceding major release lines.
        proto_version: ["34.1", "35.0", "36.1.bcr.1"]
    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ubuntu-latest
      compiler: clang
      llvm_version: 22.1.8
      bazel_config: opt
      bazel_version: 9.2.0
      proto_version: ${{ matrix.proto_version }}
