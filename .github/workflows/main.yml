name: Test
# Validate pull requests and main. Release tags are handled by release.yml.
on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  trunk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Trunk Check
        uses: trunk-io/trunk-action@v1
        with:
          save-annotations: true

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: trunk-fmt,clang-tidy
      - uses: pre-commit-ci/lite-action@v1.1.0
        if: always()

  clang-tidy:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Select the scope to lint
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git fetch --quiet --no-tags origin main
            git diff --name-only origin/main...HEAD >.clang-tidy-changes
          else
            : >.clang-tidy-changes
          fi
          python3 tools/clang_tidy_ci.py "${EVENT_NAME}" \
            <.clang-tidy-changes >.clang-tidy-inputs
          echo "clang-tidy inputs for ${EVENT_NAME}:"
          sed 's/^/  /' .clang-tidy-inputs
      - name: Build and generate the compilation database
        run: |
          bazel build --config=clang-tidy //...
          ./compile_commands-update.sh
      - name: Run clang-tidy
        run: |
          mapfile -t CLANG_TIDY_INPUTS <.clang-tidy-inputs
          tools/clang_tidy.sh "${CLANG_TIDY_INPUTS[@]}"

  coverage:
    needs: [trunk, pre-commit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: bazelbuild/setup-bazelisk@v3
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install coverage tooling
        run: |
          sudo apt-get install -y lcov
          tools/install_lcov.sh "${RUNNER_TEMP}/lcov"
          echo "${RUNNER_TEMP}/lcov/bin" >>"${GITHUB_PATH}"
      - name: Collect and enforce coverage
        env:
          COVERAGE_PAGE: ${{ github.event_name == 'pull_request' && format('pr/{0}', github.event.pull_request.number) || 'main' }}
        run: |
          set -euo pipefail
          bazel coverage --config=clang -c dbg //... \
            --experimental_use_llvm_covmap \
            --experimental_generate_llvm_lcov \
            --copt=-fcoverage-compilation-dir=. \
            --combined_report=lcov \
            --instrumentation_filter='^//mbo/proto[/:].*'
          cp "$(bazel info output_path)/_coverage/_coverage_report.dat" coverage.lcov
          printf '%s\n' "${COVERAGE_PAGE}" >coverage-target.txt
          python3 tools/coverage_sources.py coverage.lcov coverage-html.lcov \
            --policy coverage_policy.json --source-root coverage-source-tree
          python3 tools/coverage_lcovrc.py coverage_policy.json coverage.lcovrc
          genhtml coverage-html.lcov \
            --branch-coverage --config-file coverage.lcovrc --demangle-cpp \
            --function-coverage --hierarchical \
            --ignore-errors corrupt,inconsistent,inconsistent,negative,unsupported,unsupported \
            --output-directory coverage-html/lcov \
            --prefix "${PWD}/coverage-source-tree" --show-details \
            --title "proto production coverage"
          python3 tools/coverage_html.py coverage-html/lcov coverage_policy.json "${COVERAGE_PAGE}"
          BASE_ARGS=()
          if [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            git fetch --quiet --no-tags origin main
            BASE_ARGS=(--base-ref origin/main)
          fi
          python3 tools/coverage.py --baseline coverage_baseline.json \
            --lcov coverage.lcov \
            --json-summary coverage-html/coverage-summary.json \
            --policy coverage_policy.json --summary coverage-summary.md \
            "${BASE_ARGS[@]}"
          python3 tools/coverage_index.py report \
            coverage-html/coverage-summary.json "${COVERAGE_PAGE}" coverage-html/index.html
          cat coverage-summary.md >>"${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report
          path: |
            coverage-html/
            coverage.lcov
            coverage-summary.md
            coverage-target.txt
          retention-days: 14
          if-no-files-found: error

  test-core:
    needs: [pre-commit, trunk]
    secrets: inherit
    strategy:
      matrix:
        include:
          # Pairwise coverage keeps both supported Bazel majors on GCC without
          # multiplying every compiler/OS combination by every Bazel release.
          - os: ubuntu-latest
            compiler: gcc
            gcc_version: 14
            bazel_version: 8.7.0
            bazel_config: opt
          - os: ubuntu-latest
            compiler: gcc
            gcc_version: 14
            bazel_version: 9.2.0
            bazel_config: opt
          - os: ubuntu-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: opt
          - os: macos-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: opt

    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      gcc_version: ${{ matrix.gcc_version }}
      llvm_version: ${{ matrix.llvm_version }}
      bazel_config: ${{ matrix.bazel_config }}
      bazel_version: ${{ matrix.bazel_version }}

  test-special:
    needs: [pre-commit, trunk]
    secrets: inherit
    strategy:
      matrix:
        include:
          # Keep one sanitizer and one language-mode build instead of crossing
          # these modes with every compiler and OS.
          - os: ubuntu-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: asan
          - os: ubuntu-latest
            compiler: gcc
            gcc_version: 14
            bazel_version: 9.2.0
            bazel_config: cpp23
          # Keep compatibility one-dimensional: one Clang/Bazel/opt configuration
          # for the current protobuf major and the two preceding major lines.
          - os: ubuntu-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: opt
            proto_version: "34.1"
          - os: ubuntu-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: opt
            proto_version: "35.0"
          - os: ubuntu-latest
            compiler: clang
            llvm_version: 22.1.8
            bazel_version: 9.2.0
            bazel_config: opt
            proto_version: "36.1.bcr.1"

    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ${{ matrix.os }}
      compiler: ${{ matrix.compiler }}
      gcc_version: ${{ matrix.gcc_version }}
      llvm_version: ${{ matrix.llvm_version }}
      bazel_config: ${{ matrix.bazel_config }}
      bazel_version: ${{ matrix.bazel_version }}
      proto_version: ${{ matrix.proto_version }}

  done:
    needs: [trunk, pre-commit, clang-tidy, coverage, test-core, test-special]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Ensure every job is wired into this gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          # Parse the workflow with a real YAML reader (yq) and fail if any
          # declared job (other than this gate) is absent from `needs` above, so
          # a newly added job cannot silently escape the required gate.
          declared="$(yq '.jobs | keys | .[]' .github/workflows/main.yml |
            grep -vx done | sort)"
          wired="$(jq -r 'keys[]' <<<"${NEEDS_JSON}" | sort)"
          missing="$(comm -23 <(printf '%s\n' "${declared}") <(printf '%s\n' "${wired}"))"
          if [[ -n "${missing}" ]]; then
            echo "Jobs declared in the workflow but missing from done.needs:"
            while read -r job; do
              echo "  - ${job}"
              echo "::error title=Gate is missing a job::${job} not in done.needs"
            done <<<"${missing}"
            exit 1
          fi
          echo "done covers all $(grep -c . <<<"${declared}") workflow jobs."
      - name: Fail if any dependency did not succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
