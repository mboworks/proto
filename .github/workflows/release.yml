name: Release
on:
  push:
    tags:
      # Numeric semver only (e.g. 1.2.1); releases are <num>.<num>.<num>. This
      # is stricter than "*.*.*", which also matches things like "v1.2.x".
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read
  pull-requests: read

jobs:
  coverage:
    uses: ./.github/workflows/test.yml
    with:
      continue-on-error: false
      os: ubuntu-latest
      compiler: clang
      llvm_version: 22.1.8
      bazel_config: coverage
      coverage_target: ${{ format('tag/{0}', github.ref_name) }}

  release:
    needs: coverage
    uses: bazel-contrib/.github/.github/workflows/release_ruleset.yaml@1d798ff015ed0696433e01e2c3ccbb2abefadad7 # v7.7.0
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      release_files: proto-*.tar.gz
      # Standard releases are assembled as drafts by action-gh-release v3 and
      # published only after their assets are uploaded. Prereleases remain
      # published during upload and are incompatible with immutable releases.
      prerelease: false

  # Mirror the release to the Bazel Central Registry (replaces the retired
  # publish-to-bcr GitHub App). See .github/workflows/publish.yaml.
  publish:
    needs: release
    # Grant what publish.yaml's job requests; a called workflow cannot exceed
    # the caller's permissions.
    permissions:
      contents: write
    uses: ./.github/workflows/publish.yaml
    with:
      tag_name: ${{ github.ref_name }}
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
